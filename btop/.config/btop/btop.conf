#? Config file for btop v. 1.3.0

# TokyoNight — bundled with the btop package itself (upstream ships it
# under themes/), so unlike bat's theme, nothing extra to install here.
color_theme = "tokyo-night"

# Use the theme's own background instead of the terminal's, so btop
# doesn't show kitty's background through gaps in the layout.
theme_background = False

# Nerd Font glyphs for the process tree branches etc. — matches the
# Nerd Font installed in Phase 1.
truecolor = True
force_tty = False

# Update interval in ms. Default (2000) is sluggish for a live monitor;
# 1000 is a reasonable balance against CPU overhead from btop itself.
update_ms = 1000

vim_keys = True
rounded_corners = True
graph_symbol = "braille"
shown_boxes = "cpu mem net proc"
