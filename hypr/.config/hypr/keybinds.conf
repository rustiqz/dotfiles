# ~/dotfiles/hypr/.config/hypr/keybinds.conf
#
# Every bind is `bindd` (or bindde/bindmd/bindeld — `d` combines with
# the other flags), i.e. it carries a human description as its third
# field. That description is what `hyprctl binds -j` reports, and it's
# what bin/bin/keybinds ($mod+/) renders as the cheatsheet — so the
# cheatsheet can never drift from the real binds, same idea as Prism's
# generated-from-your-config cheatsheet. Adding a bind = adding it here,
# with a description; nothing else to update.
#
# `l` on the hardware-key binds = also works while the screen is locked
# (adjust volume/brightness from hyprlock without unlocking).
#
# $mod = SUPER (Windows key): chosen over Alt so nothing here collides
# with in-app Alt-combos (Alt+Tab, Alt+F4, etc.) that muscle memory
# already expects to reach the application, not the compositor.
$mod = SUPER
$terminal = kitty

# --- Launching ----------------------------------------------------------
# `uwsm app --` (see autostart.conf) launches each as its own scoped
# systemd unit rather than an untracked child of Hyprland — applies to
# any on-demand app launch here, not just the exec-once autostart list.
bindd = $mod, Return, Terminal, exec, uwsm app -- $terminal
# The Pokédex launcher (quickshell modules/launcher/Launcher.qml): apps,
# plus / projects, > run, @ windows, = calc, : emoji. Replaced rofi drun;
# rofi itself stays for the small pickers (clipboard, SSH, theme, emoji).
bindd = $mod, D, App launcher, exec, qs ipc call launcher toggle
bindd = $mod, Q, Close window, killactive          # close focused window
bindd = $mod SHIFT, E, Exit Hyprland, exit          # end the Hyprland session (back to GDM)

# Dedicated app launchers, for the handful of apps opened often enough
# that going through rofi drun each time is friction. B/E: mnemonic
# (Browser, `E`xplorer/Files — the Windows-convention letter for a
# file-manager shortcut, not taken by anything else here).
bindd = $mod, B, Firefox, exec, uwsm app -- firefox
bindd = $mod, E, Files (nautilus), exec, uwsm app -- nautilus

# Yazi — terminal file manager, opened in a kitty window. Separate from
# $mod,E (nautilus, GUI) rather than replacing it — different tool for
# a different moment, not a swap.
bindd = $mod, Y, Files (yazi), exec, uwsm app -- kitty --title yazi -e yazi

# Power menu: wlogout, styled per-theme like everything else (see
# wlogout/.config/wlogout/ and themes/<name>/wlogout.css). Separate
# from $mod SHIFT,E (exit) above and $mod,Escape (lock) below — this
# gives suspend/reboot/shutdown a home too, all in one grid.
# -b 5: layout.json defines exactly 5 buttons; wlogout's own default
# buttons-per-row (3) would wrap that into a 3x2 grid with one empty
# cell, confirmed by actually launching it and screenshotting before
# this flag was added.
bindd = $mod, P, Power menu, exec, uwsm app -- wlogout -b 5

# Emoji/unicode picker. Windows-convention key (Win+.) carried over
# since there's no equivalent existing muscle memory to protect here.
bindd = $mod, period, Emoji picker, exec, uwsm app -- rofimoji

# SSH picker (bin/bin/ssh-connect) — rofi over ~/.ssh/config Host
# entries, opens the selection in a new kitty window.
bindd = $mod, S, SSH hosts, exec, uwsm app -- ssh-connect

# k9s — Cluster. C, not the obvious K, because `$mod, k` is already
# movefocus-up here (`hyprctl binds -j` shows key 'k' at modmask 64,
# plus 65/68 for the move/resize variants). Writing `$mod, K` would
# leave two binds differing only in case competing for one physical
# key — Hyprland records the literal case from the config but resolves
# keysyms case-insensitively, so which one wins is not something worth
# depending on. Sidestepped rather than tested.
#
# Launched with `kitty -e` rather than through a login shell, so it
# does NOT pick up anything set in .zshrc — that's why ~/.kube/config
# is a real path every tool finds on its own (a symlink into
# ~/.config/digitalocean/, see hooks/54-do-config.sh) instead of a
# KUBECONFIG env var that would silently be unset here.
bindd = $mod, C, Kubernetes (k9s), exec, uwsm app -- kitty --title "k9s" -e k9s

# Spotify — Music. Just launches the app; the bar's volume OSD and the
# drawer's media card show/control playback once it's running.
bindd = $mod, M, Spotify, exec, uwsm app -- spotify

# Dev hub (quickshell modules/hub/Hub.qml) — agents, CI, services, ports,
# watchers, plus volume/brightness/mic, toggles and now-playing. Driven
# by single letters once open (a/c/s/p/w, j/k, Enter, Esc). Space for
# reachability; grave kept because it's where the old ags sidebar lived
# and the hub replaced it. Not wrapped in `uwsm app --`: `qs ipc call` is
# a one-shot client that exits immediately, not an app to scope.
bindd = $mod, Space, Dev hub, exec, qs ipc call hub toggle
bindd = $mod, grave, Dev hub, exec, qs ipc call hub toggle

# --- Window state ---------------------------------------------------------
bindd = $mod, V, Toggle floating, togglefloating
bindd = $mod, F, Fullscreen, fullscreen

# --- Focus movement: vim-style hjkl (h=left, j=down, k=up, l=right) -------
# Matches Neovim muscle memory instead of reaching for the arrow cluster.
bindd = $mod, h, Focus left, movefocus, l
bindd = $mod, j, Focus down, movefocus, d
bindd = $mod, k, Focus up, movefocus, u
bindd = $mod, l, Focus right, movefocus, r

# Window cycling (alt-tab equivalent). Built into Hyprland core
# (cyclenext dispatcher) — no overview plugin needed for this. Cycles
# through open windows on the current workspace; SHIFT reverses
# direction, same convention as Tab/Shift+Tab everywhere else.
bindd = $mod, Tab, Next window, cyclenext
bindd = $mod SHIFT, Tab, Previous window, cyclenext, prev

# --- Move the focused window itself, same direction scheme ---------------
bindd = $mod SHIFT, h, Move window left, movewindow, l
bindd = $mod SHIFT, j, Move window down, movewindow, d
bindd = $mod SHIFT, k, Move window up, movewindow, u
bindd = $mod SHIFT, l, Move window right, movewindow, r

# --- Resize the focused window --------------------------------------------
bindde = $mod CTRL, h, Shrink width, resizeactive, -40 0
bindde = $mod CTRL, j, Grow height, resizeactive, 0 40
bindde = $mod CTRL, k, Shrink height, resizeactive, 0 -40
bindde = $mod CTRL, l, Grow width, resizeactive, 40 0

# --- Workspaces: 1-9 then 0 for 10, standard numeric layout ---------------
bindd = $mod, 1, Workspace 1, workspace, 1
bindd = $mod, 2, Workspace 2, workspace, 2
bindd = $mod, 3, Workspace 3, workspace, 3
bindd = $mod, 4, Workspace 4, workspace, 4
bindd = $mod, 5, Workspace 5, workspace, 5
bindd = $mod, 6, Workspace 6, workspace, 6
bindd = $mod, 7, Workspace 7, workspace, 7
bindd = $mod, 8, Workspace 8, workspace, 8
bindd = $mod, 9, Workspace 9, workspace, 9
bindd = $mod, 0, Workspace 10, workspace, 10

bindd = $mod SHIFT, 1, Move to workspace 1, movetoworkspace, 1
bindd = $mod SHIFT, 2, Move to workspace 2, movetoworkspace, 2
bindd = $mod SHIFT, 3, Move to workspace 3, movetoworkspace, 3
bindd = $mod SHIFT, 4, Move to workspace 4, movetoworkspace, 4
bindd = $mod SHIFT, 5, Move to workspace 5, movetoworkspace, 5
bindd = $mod SHIFT, 6, Move to workspace 6, movetoworkspace, 6
bindd = $mod SHIFT, 7, Move to workspace 7, movetoworkspace, 7
bindd = $mod SHIFT, 8, Move to workspace 8, movetoworkspace, 8
bindd = $mod SHIFT, 9, Move to workspace 9, movetoworkspace, 9
bindd = $mod SHIFT, 0, Move to workspace 10, movetoworkspace, 10

# --- Mouse: SUPER + drag to move/resize without needing the border -------
bindmd = $mod, mouse:272, Drag window, movewindow      # left button
bindmd = $mod, mouse:273, Resize window, resizewindow    # right button

# --- Laptop hardware keys -------------------------------------------------
# brightnessctl (packages/pacman.txt) specifically for this. The bar's dev
# island doubles as the OSD: volume it picks up from PipeWire on its own,
# but sysfs backlight emits no change event to watch, so the brightness
# binds poke it over Quickshell IPC (`qs ipc call bar brightness`) after
# setting the level. binde (not bind) repeats while held, so holding the key ramps
# smoothly instead of stepping once per press.
bindeld = , XF86MonBrightnessUp, Brightness up, exec, brightnessctl set 5%+ && qs ipc call bar brightness
bindeld = , XF86MonBrightnessDown, Brightness down, exec, brightnessctl set 5%- && qs ipc call bar brightness

# Volume, via wpctl — WirePlumber's own CLI, already present since
# wireplumber is a hard PipeWire dependency from Phase 1. @DEFAULT_AUDIO_SINK@
# targets whatever PipeWire currently considers the default output, so this
# keeps working if you ever switch to headphones/a dock.
bindeld = , XF86AudioRaiseVolume, Volume up, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindeld = , XF86AudioLowerVolume, Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindld = , XF86AudioMute, Mute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# --- Lock screen + wallpaper picker -----------------------------------------
# Not $mod, L: hjkl already claims plain/SHIFT/CTRL "l" for focus/move/
# resize, so lock goes on Escape instead — same command hypridle's own
# lock_cmd runs, just triggerable on demand rather than only on idle.
bindd = $mod, Escape, Lock screen, exec, loginctl lock-session
bindd = $mod, W, Wallpaper picker, exec, uwsm app -- wallpaper

# Whole-desktop theme switcher (bin/bin/theme), no-args form pops its
# own rofi picker over themes/*/. SHIFT because plain $mod,T isn't
# taken by anything yet either, but keeps a consistent "SHIFT = pick
# from a list" feel alongside $mod SHIFT's workspace-move binds above.
bindd = $mod SHIFT, T, Theme picker, exec, uwsm app -- theme

# --- Screenshots (bin/bin/screenshot) ---------------------------------------
# Bare Print / $mod+Print: region — the everyday screenshot, so it gets
# the plain key. SHIFT selects the other two modes (screen, window);
# CTRL on top of any of them adds the swappy annotate step. Direct-save
# still copies to clipboard + fires a notification (see the script), so
# the "fast path" isn't silent, just skips the editor.
bindd = , Print, Screenshot region, exec, uwsm app -- screenshot region
bindd = $mod CTRL, Print, Screenshot region + edit, exec, uwsm app -- screenshot region --edit
bindd = $mod SHIFT, Print, Screenshot screen, exec, uwsm app -- screenshot screen
bindd = $mod SHIFT CTRL, Print, Screenshot screen + edit, exec, uwsm app -- screenshot screen --edit
bindd = $mod, Print, Screenshot window, exec, uwsm app -- screenshot window
bindd = $mod ALT, Print, Screenshot window + edit, exec, uwsm app -- screenshot window --edit

# --- Clipboard history (cliphist, watchers in autostart.conf) -------------
# $mod, V is already togglefloating, so CTRL is added rather than
# picking an unrelated key — keeps the "V" mnemonic for "paste history".
# -display-columns 2 hides cliphist's numeric entry ID from the rofi
# list (needed internally to look up the exact original bytes, not
# meant to be read) — see cliphist's own FAQ on this exact trick.
bindd = $mod CTRL, V, Clipboard history, exec, sh -c 'cliphist list | rofi -dmenu -display-columns 2 | cliphist decode | wl-copy'
bindd = $mod CTRL SHIFT, V, Delete clipboard entry, exec, sh -c 'cliphist list | rofi -dmenu -display-columns 2 | cliphist delete'

# --- Shell extras (Prism-inspired) -------------------------------------------
# Cheatsheet: every bindd above, grouped and searchable — read live from
# `hyprctl binds -j` (quickshell modules/cheatsheet/Cheatsheet.qml).
bindd = $mod, slash, Keybind cheatsheet, exec, qs ipc call cheatsheet toggle

# Notification centre (swaync) — same panel as the bar's bell icon.
bindd = $mod, N, Notification centre, exec, swaync-client -t -sw

# Open-window search (rofi window mode) — faster than Tab-cycling once
# there are more than ~3 windows spread over several workspaces.
bindd = $mod, R, Search open windows, exec, uwsm app -- rofi -show window

# Dropdown terminal on a special workspace: $mod+Z toggles it over
# whatever you're doing, without disturbing the tiled layout underneath.
# windowrules.conf floats/centres it by the "scratchpad" title. The
# on-created-empty rule spawns it the first time instead of needing a
# separate exec-once.
workspace = special:scratch, on-created-empty:uwsm app -- kitty --title scratchpad
bindd = $mod, Z, Dropdown terminal, togglespecialworkspace, scratch
bindd = $mod SHIFT, Z, Send window to scratchpad, movetoworkspace, special:scratch

# Mouse wheel over the desktop with $mod held flips workspaces — pairs
# with the 3-finger swipe gesture in input.conf.
bindd = $mod, mouse_down, Next workspace, workspace, e+1
bindd = $mod, mouse_up, Previous workspace, workspace, e-1

# Media keys (playerctl drives whichever MPRIS player is active). `l` so
# they work on the lock screen too.
bindld = , XF86AudioPlay, Play / pause, exec, playerctl play-pause
bindld = , XF86AudioNext, Next track, exec, playerctl next
bindld = , XF86AudioPrev, Previous track, exec, playerctl previous
bindld = , XF86AudioMicMute, Mute microphone, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
