# themes/tokyonight/hyprland.conf
#
# Same TokyoNight hex values as themes/tokyonight/kitty.conf. Symlinked
# in as hypr/.config/hypr/active-theme.conf (bin/bin/theme) and sourced
# by BOTH hyprland.conf (via look.conf) and hyprlock.conf independently
# — they're two separate programs with two separate config loads, so
# each needs its own `source =` line pointing at this same symlink.
#
# Two formats for what are otherwise the same colors: Hyprland's own
# border/shadow properties want hex-packed rgb()/rgba(), hyprlock's
# rendering properties want comma-separated decimal rgb()/rgba() — both
# are valid hyprlang, just different conventions each tool's example
# configs happened to use. hyprlang variables are plain text
# substitution, so there's no way to derive one form from the other;
# both are defined explicitly.

# --- Hyprland compositor (look.conf) ---------------------------------------
$border_active = rgb(7aa2f7)
$border_inactive = rgb(292e42)
$shadow_color = rgba(1a1b26aa)

# --- hyprlock ----------------------------------------------------------------
$lock_bg = rgba(26, 27, 38, 0.85)
$lock_accent = rgba(122, 162, 247, 0.9)
$lock_accent_dim = rgba(122, 162, 247, 0.3)
$lock_success = rgba(158, 206, 106, 0.9)
$lock_error = rgba(247, 118, 142, 0.9)
$lock_fg = rgb(192, 202, 245)
