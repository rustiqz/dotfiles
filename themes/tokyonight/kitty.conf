# TokyoNight (Night variant) colors for kitty.
# Palette matches the terminal colors shipped in folke/tokyonight.nvim,
# so a Neovim buffer and the terminal it runs in read as one surface.
# Kept as its own file (rather than inline in kitty.conf) so it can be
# swapped for tokyonight-storm/-day without touching anything else.

foreground              #c0caf5
background              #1a1b26
selection_foreground    #c0caf5
selection_background    #283457
url_color                #73daca
cursor                  #c0caf5
cursor_text_color       #1a1b26

# Tabs
active_tab_foreground   #16161e
active_tab_background   #7aa2f7
inactive_tab_foreground #545c7e
inactive_tab_background #292e42
tab_bar_background      #15161e

# Window borders — active border matches the accent used in starship/lazygit
active_border_color     #7aa2f7
inactive_border_color   #292e42

# black
color0  #15161e
color8  #414868

# red
color1  #f7768e
color9  #f7768e

# green
color2  #9ece6a
color10 #9ece6a

# yellow
color3  #e0af68
color11 #e0af68

# blue
color4  #7aa2f7
color12 #7aa2f7

# magenta
color5  #bb9af7
color13 #bb9af7

# cyan
color6  #7dcfff
color14 #7dcfff

# white
color7  #a9b1d6
color15 #c0caf5
