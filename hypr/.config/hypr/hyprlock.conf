# ~/dotfiles/hypr/.config/hypr/hyprlock.conf
#
# TokyoNight, matching everything except swaync (which is a deliberate
# breakaway theme — see swaync/.config/swaync/style.css). Background
# reads through the same .current symlink as hyprpaper.conf, so the
# lock screen always shows a blurred version of whatever the desktop
# wallpaper currently is, not a separately-hardcoded image.
#
# Fingerprint auth is NOT enabled here: this laptop's sensor (FocalTech
# FT9201) has no official Arch/libfprint support, only an AUR proprietary
# driver that conflicts with extra/libfprint on install — see CLAUDE.md's
# gotchas and the Phase 5 optional follow-up. Password-only for now.

$wallpaper = ~/.local/share/wallpapers/.current
$font = JetBrainsMono Nerd Font

general {
  hide_cursor = false
}

background {
  monitor =
  path = $wallpaper
  blur_passes = 2
  blur_size = 4
}

input-field {
  monitor =
  size = 300, 50
  outline_thickness = 3
  rounding = 6                                   # matches decoration.rounding in look.conf

  inner_color = rgba(26, 27, 38, 0.85)            # TokyoNight bg
  outer_color = rgba(122, 162, 247, 0.9) rgba(122, 162, 247, 0.3) 45deg  # accent blue
  check_color = rgba(158, 206, 106, 0.9)          # green — matches color2 in kitty's palette
  fail_color = rgba(247, 118, 142, 0.9)           # red — matches color1

  font_color = rgb(192, 202, 245)                 # TokyoNight fg
  font_family = $font
  placeholder_text = <span foreground="##545c7e">Enter Password</span>
  fail_text = <span foreground="##f7768e">$FAIL ($ATTEMPTS)</span>

  fade_on_empty = false
  dots_spacing = 0.3

  position = 0, -20
  halign = center
  valign = center
}

label {
  monitor =
  text = $TIME
  font_size = 90
  font_family = $font
  color = rgb(192, 202, 245)

  position = 0, 150
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:60000] date +"%A, %d %B"
  font_size = 22
  font_family = $font
  color = rgb(122, 162, 247)

  position = 0, 60
  halign = center
  valign = center
}
