# ~/dotfiles/hypr/.config/hypr/look.conf
#
# Visual styling: gaps, borders, rounding, blur, animations. No hardcoded
# colors here — $border_active/$border_gradient/$border_inactive/
# $shadow_color come from active-theme.conf (sourced in hyprland.conf,
# before this file), a symlink bin/bin/theme repoints (see
# themes/<name>/hyprland.conf).
#
# Design direction ("floating glass", inspired by the Prism Quickshell
# shell — github.com/Jack02134x/prism-shell — but rebuilt on this repo's
# Quickshell/rofi stack rather than copied): every surface is a soft,
# heavily-rounded card floating off the wallpaper, never a slab glued to
# a screen edge. The values below are what make windows read as part of
# that same family as the bar islands and the dev hub:
#   - one shared corner radius (14px) across windows, bar, drawer, rofi
#   - gaps wide enough that the wallpaper frames every window
#   - a two-colour gradient on the focused border instead of a flat line
#   - a large, low-opacity shadow (depth) rather than a tight dark one

general {
  gaps_in = 6           # gap between adjacent windows
  gaps_out = 12         # gap between windows and the screen edge — matches
                        # waybar's island margin, so bar and windows line up
  border_size = 2

  # Gradient: theme accent fading into its secondary hue at 45deg. Hyprland
  # animates the angle via the `borderangle` animation below, so the focused
  # window gets a slow shimmer — subtle, but it's what makes focus obvious
  # at a glance without a thicker border.
  col.active_border = $border_active $border_gradient 45deg
  col.inactive_border = $border_inactive

  resize_on_border = true   # lets you grab a border with the mouse to resize,
                             # not just the mod+drag bind in keybinds.conf
  layout = dwindle           # Hyprland's default BSP-style auto-tiler
}

decoration {
  rounding = 14
  rounding_power = 2.4      # >2 = squircle-ish corners (Apple/Prism style)
                            # instead of plain circular arcs

  active_opacity = 1.0
  inactive_opacity = 0.96   # unfocused windows recede very slightly —
                            # enough to guide the eye, not enough to make
                            # reading a second window annoying
  dim_inactive = false

  # Blur behind anything translucent (kitty's background_opacity, the bar
  # islands, rofi, the dev hub — those layers opt in via layerrule in
  # windowrules.conf). size/passes tuned for a Gen9.5 iGPU: 3 passes at
  # size 6 is the point where it looks frosted rather than smeared;
  # going higher costs frame time for no visible gain at 1080p.
  blur {
    enabled = true
    size = 6
    passes = 3
    new_optimizations = true
    xray = false            # blur what's actually behind, not just wallpaper
    noise = 0.02            # a hint of grain stops gradients banding
    contrast = 1.0
    brightness = 0.9
    vibrancy = 0.2          # keeps wallpaper colour alive through the blur
    popups = true           # right-click menus get the same frosted look
  }

  shadow {
    enabled = true
    range = 24
    render_power = 3        # softer falloff than the default 2
    offset = 0 6            # light comes from above — shadow sits below
    color = $shadow_color
    color_inactive = rgba(00000033)
  }
}

# Animations: Material 3 easing curves (the same family Prism uses), so
# things decelerate into place instead of linearly sliding. `overshot`
# gives workspace switches a tiny settle-bounce; windows pop in from 80%.
animations {
  enabled = true

  bezier = md3_standard, 0.2, 0.0, 0, 1.0
  bezier = md3_decel, 0.05, 0.7, 0.1, 1
  bezier = overshot, 0.05, 0.9, 0.1, 1.05
  bezier = linear, 0, 0, 1, 1

  animation = windows, 1, 3, md3_decel, popin 80%
  animation = windowsOut, 1, 3, md3_standard, popin 80%
  animation = windowsMove, 1, 3, md3_decel
  animation = border, 1, 10, default
  animation = borderangle, 1, 80, linear, loop   # the slow gradient shimmer
  animation = fade, 1, 3, md3_decel
  animation = layersIn, 1, 3, md3_decel, slide
  animation = layersOut, 1, 2, md3_standard, fade
  animation = workspaces, 1, 4, overshot, slide
  animation = specialWorkspace, 1, 3, md3_decel, slidevert
}

dwindle {
  preserve_split = true     # a split's direction survives window closes
                            # instead of re-deciding (layout stops jumping)
}

misc {
  disable_hyprland_logo = true     # the anime-girl default wallpaper flashes
  disable_splash_rendering = true  # before hyprpaper paints otherwise
  animate_manual_resizes = true
  animate_mouse_windowdragging = false   # dragging should track the cursor
                                         # 1:1, not lag behind on a curve
  focus_on_activate = true         # e.g. clicking a link focuses the browser
}
