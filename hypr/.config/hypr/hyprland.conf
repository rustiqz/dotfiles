# ~/dotfiles/hypr/.config/hypr/hyprland.conf
#
# Entry point. Hyprland reads this file first; everything else is split
# into fragments by concern and pulled in below with `source`. Splitting
# keeps each file short enough to hold in your head — monitors.conf never
# needs touching once it's right, keybinds.conf grows as later Phase 5
# components (launcher, lock, screenshots) add their own binds, and so on.
#
# Reference for every option: https://wiki.hyprland.org/Configuring/

source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
# Symlink (bin/bin/theme repoints it, see themes/<name>/hyprland.conf) —
# must come before look.conf, which uses the $border_active etc.
# variables this defines.
source = ~/.config/hypr/active-theme.conf
source = ~/.config/hypr/look.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/windowrules.conf
source = ~/.config/hypr/autostart.conf
