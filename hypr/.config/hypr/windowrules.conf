# ~/dotfiles/hypr/.config/hypr/windowrules.conf
#
# Per-application overrides — force a picker to float, pin a window,
# open something on a specific workspace. Empty for now: rules are
# reactive by nature (you add one when a specific app misbehaves under
# tiling), so this fills in as that happens rather than being guessed
# up front.
#
# Syntax reference: https://wiki.hyprland.org/Configuring/Window-Rules/
#
# Example (commented, not active):
# windowrule = float, class:^(pavucontrol)$
