# ~/dotfiles/hypr/.config/hypr/autostart.conf
#
# `exec-once` commands run a single time when Hyprland starts a session
# (not re-run on config reload, unlike plain `exec`). This is where the
# bar, notification daemon, wallpaper, idle daemon, and polkit agent will
# each add one line as they're built later in Phase 5 — deliberately
# empty right now since none of those are installed yet.
#
# Nothing needed here for the portal: this session is launched via UWSM
# (/usr/share/wayland-sessions/hyprland-uwsm.desktop), which exports
# WAYLAND_DISPLAY into the systemd --user environment before reaching
# graphical-session.target. Both xdg-desktop-portal.service and
# xdg-desktop-portal-hyprland.service are `Type=dbus` with a `BusName=`
# and `ConditionEnvironment=WAYLAND_DISPLAY` — systemd D-Bus-activates
# them itself the first time an app requests a portal. A manual exec-once
# here would just be a redundant second launch racing the real one.
#
# From here on, prefer `exec-once = uwsm app -- <command>` for anything
# added (waybar, notification daemon, etc.) rather than a bare exec-once
# — it launches the process as its own scoped systemd unit (proper
# cgroup, clean shutdown when the session ends via `uwsm stop`) instead
# of an untracked child process of Hyprland itself.
exec-once = uwsm app -- waybar

# No exec-once needed for nm-applet/blueman-applet (tray icons behind
# waybar's "tray" module, added for live network/Bluetooth switching):
# both ship a /etc/xdg/autostart/*.desktop file, and systemd's own
# systemd-xdg-autostart-generator already turns those into scoped user
# units the instant the session reaches graphical-session.target —
# confirmed via `systemctl --user cat app-nm\x2dapplet@autostart.service`.
# Adding an exec-once here just raced that and produced a duplicate
# StatusNotifierItem registration warning for no benefit.

# swaync IS also D-Bus-activatable on org.freedesktop.Notifications
# (/usr/share/dbus-1/services/org.erikreider.swaync.service), same
# pattern as the portals above — but unlike those, it's worth starting
# explicitly anyway: that activation only fires on the first *incoming*
# notification, while waybar's bell icon (custom/notification module)
# talks to swaync's separate panel-control interface via swaync-client,
# which needs an already-running instance. Without this, clicking the
# bell before any notification had ever arrived would just fail.
exec-once = uwsm app -- swaync

# Clipboard history: two watchers, not one — per cliphist's own FAQ, a
# single `wl-paste --watch` only sees one MIME type reliably. Splitting
# text/image means both a copied paragraph and a copied screenshot
# actually end up in history, not just whichever type wl-paste guessed.
exec-once = uwsm app -- wl-paste --type text --watch cliphist store
exec-once = uwsm app -- wl-paste --type image --watch cliphist store

# Wallpaper daemon. Reads hyprpaper.conf, which points at .current — the
# symlink hooks/71-wallpaper.sh creates before this ever runs.
exec-once = uwsm app -- hyprpaper

# Idle daemon: backlight dim, lock, screen off, suspend on their own
# timeouts (hypridle.conf). Its own lock_cmd is hyprlock, so this one
# line covers both — hyprlock itself is launched on demand, not
# autostarted.
exec-once = uwsm app -- hypridle

# No exec-once for hyprpolkitagent, unlike everything above: its own
# shipped unit has WantedBy=graphical-session.target (checked against
# the actual upstream service file, not assumed) — systemctl --user
# enable, once, in hooks/72-hyprpolkitagent.sh, and it autostarts every
# session on its own from there. An exec-once here would start a
# second, redundant instance racing the real one.

# Desktop widget sidebar (ags/.config/ags/) — Docker status + rich
# now-playing card. Starts hidden (Sidebar.tsx: visible={false}) and is
# toggled on demand via $mod+grave (hypr/keybinds.conf), same as any
# other on-demand app here — this just needs the GTK application
# itself running in advance so the toggle is instant rather than
# waiting on a cold GJS/TypeScript startup every time.
exec-once = uwsm app -- ags run
