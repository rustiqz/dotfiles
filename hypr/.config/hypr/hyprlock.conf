# ~/dotfiles/hypr/.config/hypr/hyprlock.conf
#
# No hardcoded colors here — hyprlock is its own separate program (not
# part of the Hyprland process this config is normally sourced into), so
# it needs its own explicit `source =` for active-theme.conf below
# rather than inheriting hyprland.conf's. bin/bin/theme repoints that
# symlink; see themes/<name>/hyprland.conf for the $lock_* variables
# used throughout this file. Background reads through the same .current
# symlink as hyprpaper.conf, so the lock screen always shows a blurred
# version of whatever the desktop wallpaper currently is.
#
# Fingerprint auth is enabled below, but it is deliberately safe to ship to
# every machine: hyprlock probes fprintd at lock time and, if there's no
# fprintd, no reader, or no enrolled prints, it just logs "Fingerprint auth
# disabled" and carries on. auth:pam stays enabled alongside it, so the
# password field always works and a machine without a sensor sees no change.
# Nothing here installs anything — a machine only gets fingerprint unlock if
# fprintd + a working driver happen to be present.
#
# Sensors differ per machine, so don't hardcode assumptions about the reader
# in this repo; derive it from /sys/bus/usb/devices/*/idVendor on the box.

source = ~/.config/hypr/active-theme.conf

$wallpaper = ~/.local/share/wallpapers/.current
$font = JetBrainsMono Nerd Font

auth {
  fingerprint {
    enabled = true
    ready_message = Touch the sensor
    present_message = Scanning…
    retry_delay = 250
  }
}

general {
  hide_cursor = false
}

# --- Background: the desktop wallpaper, heavily blurred and dimmed, so the
# clock reads as the only thing on screen (same .current symlink as
# hyprpaper and the power menu).
background {
  monitor =
  path = $wallpaper
  blur_passes = 3
  blur_size = 7
  brightness = 0.55
  vibrancy = 0.2
}

# --- Clock: the centrepiece (Prism's lock screen). One big bold label with
# a soft shadow; $TIME follows the system's 24h/12h setting.
label {
  monitor =
  text = $TIME
  font_size = 120
  font_family = $font ExtraBold
  color = $lock_fg
  shadow_passes = 2
  shadow_size = 6
  shadow_color = rgba(0, 0, 0, 0.45)
  position = 0, 190
  halign = center
  valign = center
}

# --- Date, uppercase and letter-spaced ("T U E S D A Y ,   1 4 ...") —
# hyprlock has no letter-spacing option, so sed spaces the characters.
label {
  monitor =
  text = cmd[update:60000] date +"%A, %d %B" | tr '[:lower:]' '[:upper:]' | sed 's/./& /g'
  font_size = 15
  font_family = $font Bold
  color = $lock_accent
  position = 0, 85
  halign = center
  valign = center
}

# --- Who's locked: $USER, so it's right on every machine and account.
label {
  monitor =
  text = @$USER
  font_size = 16
  font_family = $font Bold
  color = $lock_fg
  position = 0, -40
  halign = center
  valign = center
}

input-field {
  monitor =
  size = 340, 52
  outline_thickness = 2
  rounding = -1                                  # full pill

  inner_color = $lock_bg
  outer_color = $lock_accent $lock_accent_dim 45deg
  check_color = $lock_success
  fail_color = $lock_error

  font_color = $lock_fg
  font_family = $font
  placeholder_text = <i>Password or fingerprint</i>
  fail_text = $FAIL ($ATTEMPTS)

  fade_on_empty = false
  dots_spacing = 0.35
  dots_center = true

  position = 0, -100
  halign = center
  valign = center
}

# --- Corners: battery bottom-left, now playing bottom-right. Both print
# nothing when there's nothing to say (a desktop has no BAT*, no player =
# no output), so the corners just stay empty — no per-host config.
label {
  monitor =
  text = cmd[update:30000] c=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1); [ -n "$c" ] && echo "󰁹  $c%"
  font_size = 12
  font_family = $font
  color = $lock_fg
  position = 30, 26
  halign = left
  valign = bottom
}

label {
  monitor =
  text = cmd[update:3000] t=$(playerctl metadata --format '{{ title }} — {{ artist }}' 2>/dev/null | cut -c1-60); [ -n "$t" ] && echo "󰎇  $t"
  font_size = 12
  font_family = $font
  color = $lock_fg
  position = -30, 26
  halign = right
  valign = bottom
}
