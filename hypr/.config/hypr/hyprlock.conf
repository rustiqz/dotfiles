# ~/dotfiles/hypr/.config/hypr/hyprlock.conf
#
# No hardcoded colors here — hyprlock is its own separate program (not
# part of the Hyprland process this config is normally sourced into), so
# it needs its own explicit `source =` for active-theme.conf below
# rather than inheriting hyprland.conf's. bin/bin/theme repoints that
# symlink; see themes/<name>/hyprland.conf for the $lock_* variables
# used throughout this file. Background reads through the same .current
# symlink as hyprpaper.conf, so the lock screen always shows a blurred
# version of whatever the desktop wallpaper currently is.
#
# Fingerprint auth is enabled below, but it is deliberately safe to ship to
# every machine: hyprlock probes fprintd at lock time and, if there's no
# fprintd, no reader, or no enrolled prints, it just logs "Fingerprint auth
# disabled" and carries on. auth:pam stays enabled alongside it, so the
# password field always works and a machine without a sensor sees no change.
# Nothing here installs anything — a machine only gets fingerprint unlock if
# fprintd + a working driver happen to be present.
#
# Sensors differ per machine, so don't hardcode assumptions about the reader
# in this repo; derive it from /sys/bus/usb/devices/*/idVendor on the box.

source = ~/.config/hypr/active-theme.conf

$wallpaper = ~/.local/share/wallpapers/.current
$font = JetBrainsMono Nerd Font

auth {
  fingerprint {
    enabled = true
    ready_message = Touch the sensor
    present_message = Scanning…
    retry_delay = 250
  }
}

general {
  hide_cursor = false
}

# Layout (offsets from screen centre, 1080p-tuned but resolution-
# independent — everything is centre-anchored except the two corners):
#
#              16  57                 ← two-tone clock: hours in accent
#        W E D N E S D A Y , 1 4 …       minutes in fg
#   ╭──────────────────────────────╮
#   │ (◓)  @user                   │  ← the Trainer Card: avatar (~/.face
#   │      Good evening, trainer   │     or a Pokéball), greeting, uptime,
#   │      up 5h · ◓ 12 caught     │     apps "caught" in the launcher
#   ╰──────────────────────────────╯
#        ( Password or fingerprint )
#   battery                      now playing
#
# All dynamic text comes from bin/bin/lockinfo, never inline shell: hyprlang
# reads `{ }` as arithmetic, which is how the previous version's
# now-playing label broke into "Sample Text" (caught by previewing the lock
# for real — `hyprlock --grace 30 &`, screenshot, `pkill -USR1 hyprlock`).

background {
  monitor =
  path = $wallpaper
  blur_passes = 3
  blur_size = 8
  brightness = 0.5
  vibrancy = 0.2
}

# --- Clock: hours and minutes as two labels so they can differ in colour.
# Centred at ±130: hyprlock's font_size renders larger than the 0.6em-per-
# digit pixel estimate, and the first try at ±96 ran the pairs together
# ("1659") in the preview.
label {
  monitor =
  text = cmd[update:1000] date +%H
  font_size = 130
  font_family = $font ExtraBold
  color = $lock_accent
  shadow_passes = 2
  shadow_size = 6
  shadow_color = rgba(0, 0, 0, 0.45)
  position = -130, 250
  halign = center
  valign = center
}
label {
  monitor =
  text = cmd[update:1000] date +%M
  font_size = 130
  font_family = $font ExtraBold
  color = $lock_fg
  shadow_passes = 2
  shadow_size = 6
  shadow_color = rgba(0, 0, 0, 0.45)
  position = 130, 250
  halign = center
  valign = center
}

# --- Date, uppercase and letter-spaced (sed spaces it; hyprlock has no
# letter-spacing option).
label {
  monitor =
  text = cmd[update:60000] date +"%A, %d %B" | tr '[:lower:]' '[:upper:]' | sed 's/./& /g'
  font_size = 14
  font_family = $font Bold
  color = $lock_accent
  position = 0, 135
  halign = center
  valign = center
}

# --- The Trainer Card ---------------------------------------------------------
shape {
  monitor =
  size = 480, 150
  color = $lock_bg
  rounding = 22
  border_size = 2
  border_color = $lock_accent $lock_accent_dim 45deg
  position = 0, -20
  halign = center
  valign = center
}

# Avatar: ~/.face if the account has one, else a Pokéball lockinfo renders
# once into ~/.cache. reload_cmd prints the path; reload_time makes
# hyprlock run it shortly after showing (path itself can't be dynamic).
image {
  monitor =
  path =
  reload_cmd = ~/bin/lockinfo avatar
  reload_time = 1
  size = 96
  rounding = -1
  border_size = 3
  border_color = $lock_accent
  position = -165, -20
  halign = center
  valign = center
}

label {
  monitor =
  text = @$USER
  font_size = 22
  font_family = $font ExtraBold
  color = $lock_fg
  position = 45, 20
  halign = center
  valign = center
}
label {
  monitor =
  text = cmd[update:600000] echo "$(~/bin/lockinfo greeting), trainer"
  font_size = 12
  font_family = $font Italic
  color = $lock_accent
  position = 45, -15
  halign = center
  valign = center
}
label {
  monitor =
  text = cmd[update:60000] echo "up $(~/bin/lockinfo uptime)  ·  󰐝 $(~/bin/lockinfo caught) caught"
  font_size = 11
  font_family = $font
  color = $lock_fg
  position = 45, -48
  halign = center
  valign = center
}

input-field {
  monitor =
  size = 360, 52
  outline_thickness = 2
  rounding = -1                                  # full pill

  inner_color = $lock_bg
  outer_color = $lock_accent $lock_accent_dim 45deg
  check_color = $lock_success
  fail_color = $lock_error

  font_color = $lock_fg
  font_family = $font
  placeholder_text = <i>Password or fingerprint</i>
  fail_text = $FAIL ($ATTEMPTS)

  fade_on_empty = false
  dots_spacing = 0.35
  dots_center = true

  position = 0, -150
  halign = center
  valign = center
}

# --- Corners: empty when there's nothing to say (lockinfo prints nothing).
label {
  monitor =
  text = cmd[update:30000] b=$(~/bin/lockinfo battery); [ -n "$b" ] && echo "󰁹  $b"
  font_size = 12
  font_family = $font
  color = $lock_fg
  position = 30, 26
  halign = left
  valign = bottom
}
label {
  monitor =
  text = cmd[update:3000] m=$(~/bin/lockinfo music); [ -n "$m" ] && echo "󰎇  $m"
  font_size = 12
  font_family = $font
  color = $lock_fg
  position = -30, 26
  halign = right
  valign = bottom
}
