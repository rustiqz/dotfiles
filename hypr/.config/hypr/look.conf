# ~/dotfiles/hypr/.config/hypr/look.conf
#
# Visual styling: gaps, borders, rounding, blur, animations. Border colors
# are pulled straight from kitty/.config/kitty/tokyonight.conf (the same
# accent blue used for kitty's active window border and starship/lazygit)
# so the compositor-level chrome matches everything already themed.
#
# These are reasonable starting values, not final — tune freely, this is
# the file you'll want to revisit once you're actually living in Hyprland.

general {
  gaps_in = 5           # gap between adjacent windows
  gaps_out = 10          # gap between windows and the screen edge
  border_size = 2

  # TokyoNight accent blue (#7aa2f7) for the focused window, the same
  # muted slate (#292e42) kitty uses for inactive borders/tabs.
  col.active_border = rgb(7aa2f7)
  col.inactive_border = rgb(292e42)

  resize_on_border = true   # lets you grab a border with the mouse to resize,
                             # not just the mod+drag bind in keybinds.conf
  layout = dwindle           # Hyprland's default BSP-style auto-tiler
}

decoration {
  rounding = 6

  # Subtle blur behind transparent surfaces (terminal background alpha,
  # menus). Cheap on an iGPU at this size — worth revisiting if it costs
  # noticeable battery under `powertop` later.
  blur {
    enabled = true
    size = 4
    passes = 2
  }

  shadow {
    enabled = true
    range = 8
    render_power = 2
    color = rgba(1a1b26aa)   # TokyoNight background, semi-transparent
  }
}

animations {
  enabled = true

  # Hyprland's stock "snappy" bezier curve — quick without feeling abrupt.
  bezier = myBezier, 0.05, 0.9, 0.1, 1.05

  animation = windows, 1, 4, myBezier
  animation = windowsOut, 1, 4, default, popin 80%
  animation = border, 1, 8, default
  animation = fade, 1, 4, default
  animation = workspaces, 1, 4, default
}
