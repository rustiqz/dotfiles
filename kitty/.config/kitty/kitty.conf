# ~/.config/kitty/kitty.conf
#
# kitty renders each frame on the GPU instead of shelling out to the
# terminfo/curses redraw path most terminals use — the payoff is
# noticeable in Neovim scrolling and tmux pane redraws.

# --- Font --------------------------------------------------------------------
# Must be a Nerd Font: starship, eza --icons and lazygit all draw glyphs
# from the patched Private Use Area range. Installed in packages/pacman.txt.
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# --- Cursor --------------------------------------------------------------------
cursor_shape     beam
cursor_blink_interval 0

# --- Scrollback ----------------------------------------------------------------
scrollback_lines 10000

# --- Remote control -------------------------------------------------------------
# One abstract unix socket per kitty process, and nothing else allowed to
# drive kitty (socket-only: no escape-code control from inside programs).
# bin/bin/devstat asks it which tab is on screen, so the dev island names
# the project you are looking at rather than the newest process in any
# tab. Abstract (`@`) means no file on disk; takes effect for kitty
# windows started after this is stowed.
allow_remote_control socket-only
listen_on unix:@kitty-{kitty_pid}

# --- Window --------------------------------------------------------------------
window_padding_width 6
# Closing kitty with unsaved terminal state (e.g. mid-command) is rare
# enough at a personal workstation that the confirmation prompt is just
# friction — off.
confirm_os_window_close 0

# --- Tab bar ---------------------------------------------------------------
tab_bar_edge     bottom
tab_bar_style    powerline
tab_powerline_style slanted

# --- Shell integration -------------------------------------------------------
# Lets kitty mark prompts/output so `Cmd/Ctrl+click` on paths works and
# jumping between prompts (Ctrl+Shift+Z/X) does. zsh picks this up
# automatically via kitty's own shell-integration script.
shell_integration enabled

# --- Color scheme --------------------------------------------------------------
# active-theme.conf is a symlink (bin/bin/theme repoints it, see
# themes/<name>/kitty.conf) — kitty.conf itself never needs editing to
# switch themes, or to add a new one later.
include active-theme.conf

# --- Keybindings -----------------------------------------------------------
map ctrl+shift+enter launch --cwd=current
map ctrl+shift+t      new_tab_with_cwd
map ctrl+shift+w      close_tab
map ctrl+shift+equal  change_font_size all +1.0
map ctrl+shift+minus  change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0

# --- Misc --------------------------------------------------------------------
enable_audio_bell no
update_check_interval 0
