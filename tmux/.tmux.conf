# ~/.tmux.conf

# True color, and tell tmux the terminal it's actually wrapped in (kitty)
# supports it, rather than guessing from $TERM.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB"

# Neovim reacts to Esc as the first byte of an arrow/function-key escape
# sequence and waits to see if more bytes follow — inside tmux that wait
# is on top of tmux's own escape-time, stacking into a visible delay
# before Esc takes effect. Zero here removes tmux's part of it.
set -sg escape-time 0

# Windows/panes numbered from 1, not 0 — matches their position on the
# keyboard's number row for the <prefix><number> switch keys.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g mouse on
set -g history-limit 50000

# --- Keybindings -------------------------------------------------------------
# Split panes with characters that look like what you get, in the
# current pane's directory instead of $HOME.
unbind '"'
unbind %
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"

bind r source-file ~/.tmux.conf \; display "Config reloaded"

# vi-style pane navigation/resizing — matches Neovim's h/j/k/l instead of
# tmux's default arrow-key bindings.
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# vi keys in copy-mode (search, selection), and yank straight to the
# system clipboard instead of tmux's own paste buffer.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# --- Status bar: TokyoNight (Night) -------------------------------------------
# Same palette as themes/tokyonight/kitty.conf and starship.toml —
# hand-set rather than pulled from a plugin: no tmux TokyoNight theme has
# meaningful adoption (checked; nothing near canonical), and tmux's status
# options are plain key-value settings, not a format worth outsourcing.
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left-length 40
set -g status-left "#[bg=#7aa2f7,fg=#16161e,bold] #S #[bg=#1a1b26,fg=#7aa2f7]"
set -g status-right "#[fg=#565f89]#{?client_prefix,#[fg=#e0af68]PREFIX ,}#[fg=#7dcfff]%H:%M #[fg=#565f89]│ #[fg=#9ece6a]%d-%b"

setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#292e42,fg=#c0caf5,bold] #I:#W "

set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"

set -g message-style "bg=#292e42,fg=#c0caf5"

# --- Plugins (managed by TPM, bootstrapped in hooks/60-tmux-plugins.sh) -----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# Session persistence: resurrect saves pane/window layout + running
# programs; continuum autosaves periodically and restores on tmux start,
# so a reboot doesn't lose whatever was open.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# Resurrect only re-runs programs on its whitelist — everything else comes
# back as a bare shell, so without this a restored session has the right
# windows with nothing running in them. The defaults already cover
# nvim/vim/man/less/tail/top/htop; these are the rest of what a dev
# window actually holds.
#
# A bare name here has to be the *first word* of the saved command line,
# and the whole line is re-run as saved. `->` rewrites what gets re-run
# instead: claude is saved as a bare `claude`, which would come back as
# an empty conversation, so `--continue` resumes the most recent one for
# that pane's directory.
#
# Per-machine additions (project servers, db clients) append to this in
# ~/.tmux.conf.local rather than being listed here — see the bottom of
# this file.
set -g @resurrect-processes 'watch lazygit "claude->claude --continue"'

# --- Local overrides ---------------------------------------------------
# Untracked, machine-specific tmux config — the same *.local convention
# .zshrc uses, for things that name a project or a path that only exists
# on one machine. Sourced before TPM so it can still set plugin options.
if-shell "[ -f ~/.tmux.conf.local ]" "source-file ~/.tmux.conf.local"

# Keep at the very bottom — TPM's own convention, since it needs every
# @plugin line above already registered before it runs.
run '~/.tmux/plugins/tpm/tpm'
