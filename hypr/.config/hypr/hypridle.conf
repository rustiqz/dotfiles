# ~/dotfiles/hypr/.config/hypr/hypridle.conf
#
# Idle timeouts. `hl.dsp.dpms({action = "on"/"off"})` rather than the
# older `dpms on`/`dpms off` dispatcher seen in most tutorials — this is
# what hypridle's own shipped example.conf for the exact installed
# version (0.1.8) uses; the old dispatcher form is from before a
# hyprctl syntax change.
#
# Standard laptop timeline: dim well before locking (so locking isn't a
# surprise), lock, then screen off shortly after (no point burning the
# panel once it's already locked), suspend after a longer idle stretch.

general {
  lock_cmd = pidof hyprlock || uwsm app -- hyprlock   # avoid starting multiple hyprlock instances
  before_sleep_cmd = loginctl lock-session            # lock before suspend
  after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'  # screen on w/o keypress after resume
}

# Backlight down at 2.5min idle — a warning shot before the lock at 5min.
listener {
  timeout = 150
  on-timeout = brightnessctl -s set 10
  on-resume = brightnessctl -r
}

# Lock at 5min idle.
listener {
  timeout = 300
  on-timeout = loginctl lock-session
}

# Screen off 30s after the lock — no point burning the panel on an
# already-locked screen.
listener {
  timeout = 330
  on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
  on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Suspend after 30min idle.
listener {
  timeout = 1800
  on-timeout = systemctl suspend
}
