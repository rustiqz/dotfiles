# ~/dotfiles/hypr/.config/hypr/hyprpaper.conf
#
# Wallpaper daemon. `path` points at .current, a symlink into
# ~/.local/share/wallpapers/ (wallpapers/.local/share/wallpapers/ in
# the repo) rather than a hardcoded filename — the ~/bin/wallpaper
# picker repoints that symlink and calls hyprpaper's IPC to switch live,
# so this file never needs editing when you pick a different wallpaper.
# The symlink itself is created once, idempotently, by
# hooks/71-wallpaper.sh — it has to exist before hyprpaper first reads
# this file, since `path` isn't a directory here (that would mean
# automatic timed rotation instead, not manual picking).
$wallpaper_dir = ~/.local/share/wallpapers

wallpaper {
  monitor =
  path = $wallpaper_dir/.current
  fit_mode = cover
}

# No hyprland splash text over the wallpaper.
splash = false

# Required for `hyprctl hyprpaper wallpaper ...` (used by ~/bin/wallpaper)
# to work at all.
ipc = true
