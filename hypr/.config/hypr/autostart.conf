# ~/dotfiles/hypr/.config/hypr/autostart.conf
#
# `exec-once` commands run a single time when Hyprland starts a session
# (not re-run on config reload, unlike plain `exec`). This is where the
# bar, notification daemon, wallpaper, idle daemon, and polkit agent will
# each add one line as they're built later in Phase 5 — deliberately
# empty right now since none of those are installed yet.
#
# Nothing needed here for the portal: this session is launched via UWSM
# (/usr/share/wayland-sessions/hyprland-uwsm.desktop), which exports
# WAYLAND_DISPLAY into the systemd --user environment before reaching
# graphical-session.target. Both xdg-desktop-portal.service and
# xdg-desktop-portal-hyprland.service are `Type=dbus` with a `BusName=`
# and `ConditionEnvironment=WAYLAND_DISPLAY` — systemd D-Bus-activates
# them itself the first time an app requests a portal. A manual exec-once
# here would just be a redundant second launch racing the real one.
#
# From here on, prefer `exec-once = uwsm app -- <command>` for anything
# added (waybar, notification daemon, etc.) rather than a bare exec-once
# — it launches the process as its own scoped systemd unit (proper
# cgroup, clean shutdown when the session ends via `uwsm stop`) instead
# of an untracked child process of Hyprland itself.
exec-once = uwsm app -- waybar
