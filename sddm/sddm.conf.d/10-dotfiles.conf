# Installed to /etc/sddm.conf.d/ by bin/bin/sddm-sync. Selects the theme in
# sddm/theme/ (installed as /usr/share/sddm/themes/dotfiles). The greeter
# stays on SDDM's default X11 backend: the Wayland one needs kwin_wayland,
# which this setup doesn't otherwise install.
[Theme]
Current=dotfiles
CursorTheme=Bibata-Modern-Ice
