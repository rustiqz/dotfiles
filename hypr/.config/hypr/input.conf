# ~/dotfiles/hypr/.config/hypr/input.conf
#
# Keyboard and touchpad. Values here mirror this machine's current GNOME
# settings (checked via `gsettings get org.gnome.desktop.peripherals.*`)
# so the switch to Hyprland doesn't change how typing/scrolling feels.

input {
  kb_layout = us

  # Repeat behaviour for held keys — Hyprland defaults are fine, listed
  # explicitly so they're one place to tune if they ever feel off.
  repeat_rate = 25
  repeat_delay = 600

  touchpad {
    natural_scroll = true   # matches GNOME: content follows finger direction
    tap-to-click = true     # matches GNOME: tap = click, no physical press needed
  }
}

# Trackpad-specific gesture/sensitivity tuning lives in its own block
# because Hyprland splits it from `input` — these apply only to touchpad-
# type devices, not an external mouse if one's ever plugged in.
#
# `workspace_swipe` / `workspace_swipe_fingers` (a plain on/off toggle)
# were removed in the 0.51 gesture rework in favor of an explicit bind:
# `gesture = <fingers>, <direction>, <action>`. Confirmed against the
# installed binary (0.56.1) — `strings` on it has no `workspace_swipe`
# or `workspace_swipe_fingers` symbol left, only the newer
# `workspace_swipe_distance`/`_invert`/etc. tuning keys.
gestures {
  gesture = 3, horizontal, workspace   # 3-finger swipe to switch workspaces
}
