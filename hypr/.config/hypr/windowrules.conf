# ~/dotfiles/hypr/.config/hypr/windowrules.conf
#
# Per-application overrides and per-layer (bar/launcher/drawer) effects.
#
# Syntax is Hyprland 0.53+'s unified rule form — `<effect> <value>,
# match:<prop> <regex>` — NOT the older `windowrulev2 = float,
# class:^(x)$` that most online examples still show. Every line here was
# checked with `Hyprland --verify-config` (which genuinely rejects
# unknown effects — negative-controlled with a bogus rule first) before
# landing.
#
# Syntax reference: https://wiki.hyprland.org/Configuring/Window-Rules/

# --- Small utility windows float, centred, at a sane size -------------------
# These are "settings dialogs", not workspaces-worth of app: tiling them
# just shoves whatever you were working on aside for a 10-second tweak.
# Same reasoning Prism's starter config applies to its own pickers.
$utility = ^(org\.pulseaudio\.pavucontrol|pavucontrol|blueman-manager|\.blueman-manager-wrapped|nm-connection-editor|qt5ct|qt6ct|nwg-look|xdg-desktop-portal-gtk|org\.gnome\.Calculator)$
windowrule = float on, match:class $utility
windowrule = size 60% 60%, match:class $utility
windowrule = center on, match:class $utility

# File pickers / save dialogs (portal or app-native). Matched on title
# because every toolkit reuses the parent app's class for these.
windowrule = float on, match:title ^(Open File|Open Folder|Save As|Save File|File Upload|Choose Files|Select a File)(.*)$
windowrule = center on, match:title ^(Open File|Open Folder|Save As|Save File|File Upload|Choose Files|Select a File)(.*)$

# Firefox picture-in-picture: float, pin (visible on every workspace),
# park in the bottom-right corner, keep its aspect ratio.
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = pin on, match:title ^(Picture-in-Picture)$
windowrule = keep_aspect_ratio on, match:title ^(Picture-in-Picture)$
windowrule = size 25% 25%, match:title ^(Picture-in-Picture)$
windowrule = move 74% 72%, match:title ^(Picture-in-Picture)$

# Dropdown terminal (special workspace "scratch", $mod+Z in keybinds.conf).
# The title is set by that bind, which is how it's told apart from every
# other kitty window.
windowrule = float on, match:title ^(scratchpad)$
windowrule = size 70% 60%, match:title ^(scratchpad)$
windowrule = center on, match:title ^(scratchpad)$

# Video players and browsers decide their own opacity — the global
# inactive_opacity (look.conf) dimming a paused film looks like a bug.
windowrule = opacity 1.0 override 1.0 override, match:class ^(mpv|firefox|org\.mozilla\.firefox|spotify|Spotify)$

# Fullscreen apps (games, video) shouldn't let hypridle lock the screen.
windowrule = idle_inhibit fullscreen, match:class .*

# --- Layer surfaces: blur behind the shell's own pieces ------------------------
# Layers (the Quickshell bar, rofi, swaync, the ags drawer, wlogout) are not windows,
# so they get `layerrule`, matched on the layer-shell namespace each one
# registers. `ignore_alpha` stops blur bleeding through the fully
# transparent gaps between the bar's floating islands — without it the
# whole strip, gaps included, gets a frosted rectangle behind it.
layerrule = blur on, match:namespace ^(quickshell-bar|waybar)$
layerrule = ignore_alpha 0.2, match:namespace ^(quickshell-bar|waybar)$

layerrule = blur on, match:namespace ^(rofi)$
layerrule = ignore_alpha 0.2, match:namespace ^(rofi)$
layerrule = dim_around on, match:namespace ^(rofi)$   # focus the launcher

layerrule = blur on, match:namespace ^(swaync-control-center|swaync-notification-window)$
layerrule = ignore_alpha 0.2, match:namespace ^(swaync-control-center|swaync-notification-window)$

# ags windows register their `name` as the namespace (drawer, osd —
# see ags/.config/ags/widget/*.tsx).
layerrule = blur on, match:namespace ^(drawer|osd)$
layerrule = ignore_alpha 0.2, match:namespace ^(drawer|osd)$

layerrule = blur on, match:namespace ^(logout_dialog)$   # wlogout
