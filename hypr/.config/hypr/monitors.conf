# ~/dotfiles/hypr/.config/hypr/monitors.conf
#
# Display layout. Format: monitor = name,resolution,position,scale
#
# `,preferred,auto,1` means: use the panel's native resolution, let
# Hyprland auto-place it (irrelevant with one display), 1x scale (the
# UHD Graphics panel on this laptop is 1080p — no HiDPI scaling needed).
#
# Wildcard name so this works unmodified on any single-monitor machine
# this repo gets replayed on. If a machine ever gets a second monitor
# (dock, external display), replace this with named entries — `hyprctl
# monitors` lists the real output names (eDP-1, DP-1, etc.) to target.
monitor = ,preferred,auto,1
