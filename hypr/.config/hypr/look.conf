# ~/dotfiles/hypr/.config/hypr/look.conf
#
# Visual styling: gaps, borders, rounding, blur, animations. No hardcoded
# colors here — $border_active/$border_inactive/$shadow_color come from
# active-theme.conf (sourced in hyprland.conf, before this file), a
# symlink bin/bin/theme repoints (see themes/<name>/hyprland.conf).
#
# The non-color values below (gaps, rounding, blur passes, animations)
# are reasonable starting points, not final — tune freely, this is the
# file you'll want to revisit once you're actually living in Hyprland.

general {
  gaps_in = 5           # gap between adjacent windows
  gaps_out = 10          # gap between windows and the screen edge
  border_size = 2

  col.active_border = $border_active
  col.inactive_border = $border_inactive

  resize_on_border = true   # lets you grab a border with the mouse to resize,
                             # not just the mod+drag bind in keybinds.conf
  layout = dwindle           # Hyprland's default BSP-style auto-tiler
}

decoration {
  rounding = 6

  # Subtle blur behind transparent surfaces (terminal background alpha,
  # menus). Cheap on an iGPU at this size — worth revisiting if it costs
  # noticeable battery under `powertop` later.
  blur {
    enabled = true
    size = 4
    passes = 2
  }

  shadow {
    enabled = true
    range = 8
    render_power = 2
    color = $shadow_color
  }
}

animations {
  enabled = true

  # Hyprland's stock "snappy" bezier curve — quick without feeling abrupt.
  bezier = myBezier, 0.05, 0.9, 0.1, 1.05

  animation = windows, 1, 4, myBezier
  animation = windowsOut, 1, 4, default, popin 80%
  animation = border, 1, 8, default
  animation = fade, 1, 4, default
  animation = workspaces, 1, 4, default
}
